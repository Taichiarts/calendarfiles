
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Information</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
      color: #333;
    }

    .document-container {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 8px;
    }

    .document-title {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
    }

    .document-updated {
      margin-bottom: 20px;
      color: #777;
      font-size: 12px;
    }

    #documentFrame {
      display: block;
      width: 100%;
      min-height: 600px;
      border: none;
      background: transparent;
    }

    .document-message {
      padding: 30px 0;
      color: #777;
    }

    #publishControlFrame {
      display: none;
      width: 100%;
      height: 125px;
      border: none;
      margin-bottom: 12px;
      background: transparent;
    }

    @media (max-width: 600px) {
      .document-container {
        padding: 18px;
      }

      .document-title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="document-container">

    <iframe
      id="publishControlFrame"
      title="Document publishing control"
      style="display:none;">
    </iframe>

    <div id="documentMessage" class="document-message">
      Loading information...
    </div>

    <iframe
      id="documentFrame"
      title="Published information"
      sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
      style="display:none;">
    </iframe>

  </div>

  <script>

    const AUTO_REFRESH_INTERVAL = 30 * 1000;

    let lastContentHash = null;

    const frame = document.getElementById("documentFrame");
    const message = document.getElementById("documentMessage");

    const publishControlFrame =
      document.getElementById("publishControlFrame");
    
    // Your Apps Script web app deployment URL goes here.
    const PUBLISH_CONTROL_URL =
  "https://script.google.com/a/macros/gvrtaichiarts.com/s/AKfycby1NA0Y5ZwfYSNXpXxU73BG7XPtYrwOHpGJ5f6Mq9VUYHEWIJgmEX6tNRZtihPNQRzdyQ/exec?page=publish";
    
    publishControlFrame.src = PUBLISH_CONTROL_URL;

    /*
     * Receive the document height from the iframe.
     */

    window.addEventListener("message", function(event) {

      // Message from the publishing control.
      if (event.source === publishControlFrame.contentWindow) {
    
        if (
          event.data &&
          event.data.type === "publishControlReady"
        ) {
          publishControlFrame.style.display = "block";
        }
    
        return;
      }
    
      // Message from the published document.
      if (event.source !== frame.contentWindow) {
        return;
      }
    
      if (
        event.data &&
        event.data.type === "documentHeight" &&
        Number.isFinite(event.data.height)
      ) {
        frame.style.height =
          Math.max(400, event.data.height) + "px";
      }
    
    });


    /*
     * Add a small script to the exported Google Docs HTML.
     * It reports the document height to this page.
     */

   
function addHeightReporter(html) {

    const displayStyles = `
      <style>

      /* Make the document background transparent */
        html,
        body,
        body.doc-content {
          background-color: transparent !important;
        }
    
        /* Preserve the original Google Docs page dimensions */
        body.doc-content {
          box-sizing: content-box !important;
          width: 468pt !important;
          max-width: 468pt !important;
          margin: 0 auto !important;
        }
        
        /* Restore spacing between a bullet list and
           the paragraph immediately following it */
        ul + p {
          padding-top: 12pt !important;
        }
  
        /* Make the document readable on smaller screens */
        @media screen and (max-width: 700px) {
          body.doc-content {
            box-sizing: border-box !important;
            width: 100% !important;
            max-width: 100% !important;
            padding: 24px !important;
            margin: 0 !important;
          }
        }
      </style>
    `;
  
    const reporter = `
      <script>
        function reportDocumentHeight() {
          const height = Math.max(
            document.body.scrollHeight,
            document.documentElement.scrollHeight
          );
  
          parent.postMessage({
            type: "documentHeight",
            height: height
          }, "*");
        }
  
        window.addEventListener("load", reportDocumentHeight);
        window.addEventListener("resize", reportDocumentHeight);
  
        if (window.ResizeObserver) {
          new ResizeObserver(reportDocumentHeight)
            .observe(document.body);
        }
  
        setTimeout(reportDocumentHeight, 300);
        setTimeout(reportDocumentHeight, 1000);
      <\/script>
    `;
  
    // Insert display adjustments without altering
    // the original Google Docs formatting.
    if (/<\/head>/i.test(html)) {
      html = html.replace(
        /<\/head>/i,
        displayStyles + "</head>"
      );
    } else {
      html = displayStyles + html;
    }
  
    // Add the automatic height reporting.
    if (/<\/body>/i.test(html)) {
      html = html.replace(
        /<\/body>/i,
        reporter + "</body>"
      );
    } else {
      html += reporter;
    }
  
    return html;
  }


    /*
     * Load the published Google Docs content.
     */

    function loadDocument() {

      fetch(
        "document.json?refresh=" + Date.now(),
        {
          cache: "no-store"
        }
      )

      .then(function(response) {

        if (!response.ok) {
          throw new Error(
            "Unable to load document.json"
          );
        }

        return response.json();

      })

      .then(function(data) {

        if (!data || !data.html) {
          throw new Error(
            "The published document is empty or invalid."
          );
        }

        /*
         * Avoid rebuilding the iframe when content
         * has not changed.
         */

        if (data.contentHash && data.contentHash === lastContentHash) {
          return;
        }

        lastContentHash = data.contentHash || null;

        message.style.display = "none";
        frame.style.display = "block";

        frame.srcdoc = addHeightReporter(
        data.html.replace(
          /<\/style>/i,
          `
            ul, ol {
              margin-top: 0 !important;
              margin-bottom: 0 !important;
            }
      
            li {
               margin-top: 0 !important;
              margin-bottom: 0 !important;
              padding-top: 0 !important;
              padding-bottom: 3pt !important;
            }
      
            li p {
              margin-top: 0 !important;
              margin-bottom: 0 !important;
            }
          </style>
          `
        )
      );

      })

      .catch(function(error) {

        console.error(error);

        if (!lastContentHash) {
          message.textContent =
            "Unable to load the information. Please try again later.";
        }

      });

    }


    /*
     * Initial load.
     */

    loadDocument();


    /*
     * Check for published changes every 30 seconds.
     */

    setInterval(function() {
      loadDocument();
    }, AUTO_REFRESH_INTERVAL);

  </script>

</body>
</html>
